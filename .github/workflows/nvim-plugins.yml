# Weekly Neovim plugin bump: moves nvim/lazy-lock.json to plugin commits that
# this workflow first saw at least 7 days ago (Renovate's rule for everything
# else; it can't read lazy-lock.json). Your machines pick the new lock up with
# `update-all` (chezmoi update, then `:Lazy restore`).
#
# Three jobs, because resolving updates runs plugins' own install/build code:
#   trusted  reads the plugin list + URLs from the config at the LOCKED commits
#            (versions your machines already run); runs first, and artifacts
#            can't be overwritten, so later jobs can't change it
#   resolve  runs `:Lazy! update` (the UPDATED plugins' code) with read-only
#            access and no token; only its proposed commits are used
#   bump     never runs plugin code: applies the 7-day rule, checking each
#            commit against GitHub itself (lazy_lock_bump.py), and commits;
#            the only job that can push
name: Neovim plugins

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: nvim-plugins
  cancel-in-progress: false

jobs:
  trusted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Neovim version the dotfiles pin (dot_proto/dot_prototools.tmpl).
      - name: Install Neovim
        run: |
          version=$(sed -n 's/^neovim = "\([0-9][0-9.]*\)"/\1/p' dot_proto/dot_prototools.tmpl)
          curl -fsSL "https://github.com/neovim/neovim/releases/download/v${version}/nvim-linux-x86_64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Plugin list at the locked commits
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          bash .github/scripts/nvim-plugins-update.sh trusted "$RUNNER_TEMP/trusted"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted
          path: ${{ runner.temp }}/trusted/
          retention-days: 7

  resolve:
    needs: trusted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Neovim version the dotfiles pin (dot_proto/dot_prototools.tmpl).
      - name: Install Neovim
        run: |
          version=$(sed -n 's/^neovim = "\([0-9][0-9.]*\)"/\1/p' dot_proto/dot_prototools.tmpl)
          curl -fsSL "https://github.com/neovim/neovim/releases/download/v${version}/nvim-linux-x86_64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Resolve plugin updates (runs plugin code; no token)
        run: |
          mkdir -p "$RUNNER_TEMP/resolved"
          bash .github/scripts/nvim-plugins-update.sh resolve "$RUNNER_TEMP/resolved"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved
          path: ${{ runner.temp }}/resolved/
          retention-days: 7

  bump:
    needs: [trusted, resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted
          path: ${{ runner.temp }}/trusted

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved
          path: ${{ runner.temp }}/resolved

      - name: Apply the 7-day rule
        shell: bash # -eo pipefail: a script failure isn't hidden by tee
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/lazy_lock_bump.py nvim/lazy-lock.json \
            "$RUNNER_TEMP/resolved/lazy-lock.json" "$RUNNER_TEMP/trusted/info.json" \
            .github/nvim-plugin-candidates.json | tee "$RUNNER_TEMP/changes.txt"

      - name: Commit
        run: |
          git diff --quiet -- nvim/lazy-lock.json .github/nvim-plugin-candidates.json &&
            [ -z "$(git status --porcelain -- .github/nvim-plugin-candidates.json)" ] &&
            { echo "Nothing to commit."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nvim/lazy-lock.json .github/nvim-plugin-candidates.json
          if git diff --cached --quiet -- nvim/lazy-lock.json; then
            subject="nvim: record plugin updates waiting out 7 days"
          else
            subject="nvim: plugin bumps (first seen 7+ days ago)"
          fi
          { echo "$subject"; echo; cat "$RUNNER_TEMP/changes.txt"; } | git commit -F -
          git push
