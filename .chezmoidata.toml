# Data shared by chezmoi templates.

# Versions of tools installed two ways: as proto pins where the project
# publishes a build (dot_proto/dot_prototools.tmpl), and compiled with cargo on
# ARM Linux, where it doesn't (run_onchange_after_install-cli-tools.sh.tmpl).
# One place, so the two can't drift. Plus chezmoi's own version, kept by
# run_onchange_after_chezmoi-version.sh.tmpl. Renovate bumps these (see the
# `# renovate:` lines) after a 7-day wait, like the proto pins.
[pins]
# renovate: datasource=github-releases depName=PaulJuliusMartinez/jless
jless = "0.9.0"
# renovate: datasource=github-releases depName=tummychow/git-absorb
git_absorb = "0.9.0"
# renovate: datasource=github-releases depName=twpayne/chezmoi
chezmoi = "2.73.0"
