# proto TOML plugin: sharkdp/bat release binaries. No published checksums (pin
# exactly). Registered in ~/.proto/.prototools [plugins]; managed by chezmoi.
name = "bat"
type = "cli"

[platform.macos]
archive-prefix = "bat-v{version}-{arch}-apple-darwin"
download-file = "bat-v{version}-{arch}-apple-darwin.tar.gz"
exe-path = "bat"

[platform.linux]
archive-prefix = "bat-v{version}-{arch}-unknown-linux-musl"
download-file = "bat-v{version}-{arch}-unknown-linux-musl.tar.gz"
exe-path = "bat"

[install]
download-url = "https://github.com/sharkdp/bat/releases/download/v{version}/{download_file}"

[install.arch]
aarch64 = "aarch64"
x86_64 = "x86_64"

[resolve]
git-url = "https://github.com/sharkdp/bat"
version-pattern = '^v((?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+))$'
