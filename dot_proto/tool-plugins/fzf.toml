# proto TOML plugin: junegunn/fzf release binaries (fuzzy finder). Verified
# against the release's fzf_<version>_checksums.txt. Registered in
# ~/.proto/.prototools [plugins]; managed by chezmoi. Shell integration comes
# from `fzf --zsh` (.zshrc).
name = "fzf"
type = "cli"

[platform.macos]
download-file = "fzf-{version}-darwin_{arch}.tar.gz"
checksum-file = "fzf_{version}_checksums.txt"
exe-path = "fzf"

[platform.linux]
download-file = "fzf-{version}-linux_{arch}.tar.gz"
checksum-file = "fzf_{version}_checksums.txt"
exe-path = "fzf"

[install]
download-url = "https://github.com/junegunn/fzf/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/junegunn/fzf/releases/download/v{version}/{checksum_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/junegunn/fzf"
version-pattern = '^v((?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+))$'
