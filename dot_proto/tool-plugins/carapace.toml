# proto TOML plugin: carapace-sh/carapace-bin GitHub release binaries.
# Registered in ~/.proto/.prototools [plugins]; managed by chezmoi.
# Checksums: one combined file per release, verified.
name = "carapace"
type = "cli"

[platform.macos]
download-file = "carapace-bin_{version}_darwin_{arch}.tar.gz"
checksum-file = "carapace-bin_{version}_checksums.txt"
exe-path = "carapace"

[platform.linux]
download-file = "carapace-bin_{version}_linux_{arch}.tar.gz"
checksum-file = "carapace-bin_{version}_checksums.txt"
exe-path = "carapace"

[install]
download-url = "https://github.com/carapace-sh/carapace-bin/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/carapace-sh/carapace-bin/releases/download/v{version}/{checksum_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/carapace-sh/carapace-bin"
version-pattern = '^v((?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+))$'
