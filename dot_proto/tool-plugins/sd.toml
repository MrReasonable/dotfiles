# proto TOML plugin: chmln/sd GitHub release binaries.
# Registered in ~/.proto/.prototools [plugins]; managed by chezmoi.
name = "sd"
type = "cli"

[platform.macos]
archive-prefix = "sd-v{version}-{arch}-apple-darwin"
download-file = "sd-v{version}-{arch}-apple-darwin.tar.gz"
exe-path = "sd"

[platform.linux]
archive-prefix = "sd-v{version}-{arch}-unknown-linux-musl"
download-file = "sd-v{version}-{arch}-unknown-linux-musl.tar.gz"
exe-path = "sd"

[install]
download-url = "https://github.com/chmln/sd/releases/download/v{version}/{download_file}"

[install.arch]
aarch64 = "aarch64"
x86_64 = "x86_64"

[resolve]
git-url = "https://github.com/chmln/sd"
version-pattern = '^v((?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+))$'
