# proto TOML plugin: so-fancy/diff-so-fancy, a single Perl script (perl comes
# with every Linux distro). Registered in ~/.proto/.prototools [plugins] on Linux
# only (macOS gets it from Homebrew). No published checksums (pin exactly).
# Managed by chezmoi.
name = "diff-so-fancy"
type = "cli"

[platform.linux]
download-file = "diff-so-fancy"
exe-path = "diff-so-fancy"

[install]
download-url = "https://github.com/so-fancy/diff-so-fancy/releases/download/v{version}/{download_file}"

[resolve]
git-url = "https://github.com/so-fancy/diff-so-fancy"
version-pattern = '^v((?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+))$'
