# proto TOML plugin: cli/cli (GitHub CLI) release binaries. Registered in
# ~/.proto/.prototools [plugins] on Linux only (macOS gets gh from Homebrew).
# Verified against the release's gh_<version>_checksums.txt. Managed by chezmoi.
name = "gh"
type = "cli"

[platform.linux]
archive-prefix = "gh_{version}_linux_{arch}"
download-file = "gh_{version}_linux_{arch}.tar.gz"
checksum-file = "gh_{version}_checksums.txt"
exe-path = "bin/gh"

[install]
download-url = "https://github.com/cli/cli/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/cli/cli/releases/download/v{version}/{checksum_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/cli/cli"
version-pattern = '^v((?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+))$'
