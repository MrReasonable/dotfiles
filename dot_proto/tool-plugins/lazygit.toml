# proto TOML plugin: jesseduffield/lazygit GitHub release binaries. Registered
# in ~/.proto/.prototools [plugins] on Linux only (macOS gets lazygit from
# Homebrew). Verified against the release's checksums.txt. Managed by chezmoi.
name = "lazygit"
type = "cli"

[platform.linux]
download-file = "lazygit_{version}_linux_{arch}.tar.gz"
checksum-file = "checksums.txt"
exe-path = "lazygit"

[install]
download-url = "https://github.com/jesseduffield/lazygit/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/jesseduffield/lazygit/releases/download/v{version}/{checksum_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "x86_64"

[resolve]
git-url = "https://github.com/jesseduffield/lazygit"
version-pattern = '^v((?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+))$'
